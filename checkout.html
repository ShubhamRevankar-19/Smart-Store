<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Smart Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-glass py-3">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html"><i class="bi bi-bag-check-fill me-1"></i>Smart Store</a>
      <div class="theme-toggle" onclick="toggleTheme()"><div class="knob"><i class="bi bi-sun-fill" style="font-size:0.65rem"></i></div></div>
    </div>
  </nav>

  <main class="container my-4" id="checkoutContent">
    <h2 class="mb-4"><i class="bi bi-credit-card me-2"></i>Checkout</h2>
    <div class="row g-4">
      <div class="col-lg-7">
        <form onsubmit="placeOrder(event)">
          <div class="card-surface p-4 mb-4">
            <h5 class="mb-3"><i class="bi bi-geo-alt me-2"></i>Shipping Address</h5>
            <div class="row g-2">
              <div class="col-6"><input class="form-control" name="fullName" placeholder="Full Name" required></div>
              <div class="col-6"><input class="form-control" name="phone" placeholder="Phone" required></div>
              <div class="col-12"><input class="form-control" name="line1" placeholder="Address Line 1" required></div>
              <div class="col-12"><input class="form-control" name="line2" placeholder="Address Line 2 (optional)"></div>
              <div class="col-6"><input class="form-control" name="city" placeholder="City" required></div>
              <div class="col-6"><input class="form-control" name="state" placeholder="State" required></div>
              <div class="col-6"><input class="form-control" name="postalCode" placeholder="Postal Code" required></div>
              <div class="col-6"><input class="form-control" name="country" placeholder="Country" value="India"></div>
            </div>
          </div>

          <div class="card-surface p-4 mb-4">
            <h5 class="mb-3"><i class="bi bi-wallet2 me-2"></i>Payment Method</h5>
            <div class="form-check card-surface p-3 mb-2">
              <input class="form-check-input" type="radio" name="paymentMethod" value="COD" id="pmCod" checked>
              <label class="form-check-label" for="pmCod"><strong>Cash on Delivery</strong><div class="text-muted small">Pay when your order arrives</div></label>
            </div>
            <div class="form-check card-surface p-3">
              <input class="form-check-input" type="radio" name="paymentMethod" value="DUMMY_CARD" id="pmCard">
              <label class="form-check-label" for="pmCard"><strong>Credit / Debit Card (Demo)</strong><div class="text-muted small">Simulated payment — no real charge</div></label>
            </div>
          </div>

          <button type="submit" class="btn btn-brand w-100 py-2">
            <i class="bi bi-check-circle me-2"></i>Place Order
          </button>
        </form>
      </div>
      <div class="col-lg-5">
        <div class="card-surface p-4" style="position:sticky;top:90px">
          <h5 class="mb-3">Order Summary</h5>
          <div id="orderSummary"><div class="skeleton" style="height:200px"></div></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
