<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — Smart Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-glass py-3">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html"><i class="bi bi-bag-check-fill me-1"></i>Smart Store</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><i class="bi bi-list fs-2"></i></button>
      <div class="collapse navbar-collapse" id="navMain">
        <div class="search-wrap mx-lg-4 my-3 my-lg-0 flex-grow-1" style="max-width:520px">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0" style="border-radius:12px 0 0 12px;border-color:var(--border);background:var(--surface) !important"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control border-start-0" style="border-radius:0 12px 12px 0" placeholder="Search products...">
          </div>
          <div class="search-suggestions" id="searchSuggestions"></div>
        </div>
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><div class="theme-toggle" onclick="toggleTheme()"><div class="knob"><i class="bi bi-sun-fill" style="font-size:0.65rem"></i></div></div></li>
          <li class="nav-item"><a href="profile.html#notifications" class="nav-icon-btn"><i class="bi bi-bell"></i><span class="badge-dot" id="notifBadge" style="display:none">0</span></a></li>
          <li class="nav-item"><a href="wishlist.html" class="nav-icon-btn"><i class="bi bi-heart"></i></a></li>
          <li class="nav-item"><a href="cart.html" class="nav-icon-btn"><i class="bi bi-cart3"></i><span class="badge-dot" id="cartBadge" style="display:none">0</span></a></li>
          <li class="nav-item ms-lg-2" id="authArea"></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h2 class="mb-4"><i class="bi bi-heart me-2"></i>My Wishlist</h2>
    <div class="row g-4 stagger" id="wishlistGrid">
      <div class="col-6 col-md-4 col-lg-3"><div class="skeleton" style="height:320px"></div></div>
      <div class="col-6 col-md-4 col-lg-3"><div class="skeleton" style="height:320px"></div></div>
    </div>
  </main>

  <footer class="footer-surface mt-5 pt-5 pb-4">
    <div class="container text-center text-muted small">© 2026 Smart Store.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
