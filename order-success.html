<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Smart Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-glass py-3">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html"><i class="bi bi-bag-check-fill me-1"></i>Smart Store</a>
      <div class="theme-toggle" onclick="toggleTheme()"><div class="knob"><i class="bi bi-sun-fill" style="font-size:0.65rem"></i></div></div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="auth-card card-surface p-5 text-center animate-pop">
      <i class="bi bi-check-circle-fill text-success" style="font-size:4rem"></i>
      <h2 class="mt-3 mb-2">Order Confirmed!</h2>
      <p class="text-muted">Thank you for shopping with us. Your order <strong id="orderIdDisplay">#—</strong> has been placed successfully.</p>
      <h4 class="my-3">Total: <span id="orderTotalDisplay">₹0</span></h4>
      <div class="d-flex flex-column gap-2 mt-4">
        <a href="#" id="invoiceBtn" class="btn btn-outline-brand"><i class="bi bi-file-earmark-pdf me-2"></i>Download Invoice</a>
        <a href="#" id="viewOrderBtn" class="btn btn-brand">Track Your Order</a>
        <a href="shop.html" class="btn btn-link text-muted">Continue Shopping</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/order-success.js"></script>
</body>
</html>
