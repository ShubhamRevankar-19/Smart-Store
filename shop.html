<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Smart Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-glass py-3">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html"><i class="bi bi-bag-check-fill me-1"></i>Smart Store</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <i class="bi bi-list fs-2"></i>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <div class="search-wrap mx-lg-4 my-3 my-lg-0 flex-grow-1" style="max-width:520px">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0" style="border-radius:12px 0 0 12px;border-color:var(--border);background:var(--surface) !important"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control border-start-0" style="border-radius:0 12px 12px 0" placeholder="Search products, brands and more...">
          </div>
          <div class="search-suggestions" id="searchSuggestions"></div>
        </div>
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item">
            <div class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">
              <div class="knob"><i class="bi bi-sun-fill" style="font-size:0.65rem"></i></div>
            </div>
          </li>
          <li class="nav-item">
            <a href="profile.html#notifications" class="nav-icon-btn" title="Notifications">
              <i class="bi bi-bell"></i><span class="badge-dot" id="notifBadge" style="display:none">0</span>
            </a>
          </li>
          <li class="nav-item"><a href="wishlist.html" class="nav-icon-btn" title="Wishlist"><i class="bi bi-heart"></i></a></li>
          <li class="nav-item">
            <a href="cart.html" class="nav-icon-btn" title="Cart">
              <i class="bi bi-cart3"></i><span class="badge-dot" id="cartBadge" style="display:none">0</span>
            </a>
          </li>
          <li class="nav-item ms-lg-2" id="authArea"></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container py-2 d-flex gap-2 overflow-auto" id="categoryPills" style="scrollbar-width:none"></div>

  <main class="container my-4">
    <div class="row g-4">
      <!-- Filters -->
      <div class="col-lg-3">
        <div class="card-surface p-4 animate-in" style="position:sticky;top:90px">
          <h6 class="mb-3"><i class="bi bi-funnel me-2"></i>Filters</h6>

          <label class="form-label small fw-semibold">Price Range</label>
          <div class="d-flex gap-2 mb-3">
            <input type="number" id="minPrice" class="form-control form-control-sm" placeholder="Min">
            <input type="number" id="maxPrice" class="form-control form-control-sm" placeholder="Max">
          </div>

          <label class="form-label small fw-semibold">Minimum Rating</label>
          <div class="mb-3">
            <div class="form-check" style="cursor:pointer">
              <input class="form-check-input" type="radio" name="ratingFilter" id="r0" value="0" checked>
              <label class="form-check-label small" for="r0">Any rating</label>
            </div>
            <div class="form-check" style="cursor:pointer">
              <input class="form-check-input" type="radio" name="ratingFilter" id="r4" value="4">
              <label class="form-check-label small" for="r4">4★ &amp; above</label>
            </div>
            <div class="form-check" style="cursor:pointer">
              <input class="form-check-input" type="radio" name="ratingFilter" id="r3" value="3">
              <label class="form-check-label small" for="r3">3★ &amp; above</label>
            </div>
          </div>

          <button class="btn btn-brand w-100" onclick="applyFilters()">Apply Filters</button>
        </div>
      </div>

      <!-- Product grid -->
      <div class="col-lg-9">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <div>
            <p class="mb-0" id="resultsCount">Loading...</p>
            <p class="text-brand small mb-0" id="searchContext" style="display:none"></p>
          </div>
          <select class="form-select w-auto" id="sortSelect" onchange="applyFilters()">
            <option value="">Sort: Newest</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
            <option value="popular">Most Popular</option>
          </select>
        </div>
        <div class="row g-4 stagger" id="productsGrid"></div>
        <nav class="mt-4">
          <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </main>

  <footer class="footer-surface mt-5 pt-5 pb-4">
    <div class="container text-center text-muted small">© 2026 Smart Store. All prices in INR.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
